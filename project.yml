name: Calli
options:
  bundleIdPrefix: com.ibhatech
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"
  GENERATE_INFOPLIST_FILE: YES
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: "1.0.0"
  DEVELOPMENT_TEAM: YP88XG6Z29
  CODE_SIGN_STYLE: Automatic
targets:
  Calli:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Calli/Sources
      - path: Calli/Resources
    info:
      path: Calli/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ibhatech.hanzislate
      INFOPLIST_KEY_CFBundleDisplayName: "HanziSlate"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CalliTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/CalliTests
    dependencies:
      - target: Calli
  CalliUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/CalliUITests
    dependencies:
      - target: Calli
