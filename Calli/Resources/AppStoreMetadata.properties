# Store Description & Mandatory Compliance Copy
app.store_description=Master Chinese character writing and listening with HanziSlate. Practice stroke-by-stroke tracing across all official HSK 3.0 levels (Levels 1 through 9) with real-time stroke order verification, directional guidelines, and authentic Pinyin audio.\n\nKey Features:\n- Complete HSK 3.0 Syllabus: Practice characters from Beginner (HSK 1) to Advanced (HSK 9).\n- Real-Time Stroke Guidance: Directional guides and animated stroke previews ensure accurate stroke order.\n- Native Audio: Crystal-clear Mandarin pronunciation with tone indicators.\n- Distraction-Free & Privacy-Focused: No ads, no tracking, works completely offline.\n\nDisclaimer:\nHSK is a registered trademark of Chinese Testing International (CTI). This application is an independent educational study aid and is not officially affiliated with, endorsed by, or certified by CTI, Hanban, or the Center for Language Education and Cooperation (CLEC).

